<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đặng Đức Tuấn - Profile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231877f2'/><path d='M50 25a15 15 0 100 30 15 15 0 000-30zm0 35c-15 0-25 8-25 20v5h50v-5c0-12-10-20-25-20z' fill='white'/></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #6a11cb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow: hidden;
    padding: 20px;
    perspective: 1000px;
  }

  @keyframes gradientBG {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* iframe SoundCloud ẩn */
  .sc-hidden {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 200px;
    height: 200px;
    opacity: 0;
    pointer-events: none;
  }

  /* ============================================
     THÔNG BÁO NHẮC PHÁT NHẠC
     ============================================ */
  .play-hint {
    position: fixed;
    top: 80px;
    right: 20px;
    background: rgba(106, 17, 203, 0.95);
    color: #fff;
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 8px 25px rgba(106, 17, 203, 0.6);
    z-index: 101;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.4s, transform 0.4s;
    pointer-events: none;
    animation: hintBounce 1.5s ease-in-out infinite;
  }
  .play-hint.show {
    opacity: 1;
    transform: translateY(0);
  }
  @keyframes hintBounce {
    0%, 100% { box-shadow: 0 8px 25px rgba(106, 17, 203, 0.6); }
    50% { box-shadow: 0 8px 35px rgba(106, 17, 203, 1); }
  }

  /* ============================================
     MUSIC PLAYER - GÓC TRÊN BÊN PHẢI
     ============================================ */
  .music-player {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 50px;
    padding: 8px 20px 8px 8px;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transition: box-shadow 0.4s, border-color 0.4s;
    animation: slideInFromTop 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideInFromTop {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .music-player.playing {
    box-shadow: 0 0 30px rgba(106, 17, 203, 0.6), 0 10px 30px rgba(0, 0, 0, 0.3);
    border-color: rgba(106, 17, 203, 0.6);
  }

  /* Nút Play/Pause - ĐÃ TỐI ƯU CHO CẢM GIÁC NHANH */
  .music-play-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    flex-shrink: 0;
    box-shadow: 0 4px 15px rgba(106, 17, 203, 0.6);
    position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }
  .music-play-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 25px rgba(106, 17, 203, 0.9);
  }
  .music-play-btn:active { transform: scale(0.9); }
  .music-play-btn i { 
    margin-left: 3px; 
    transition: margin 0.15s;
    pointer-events: none;
  }
  .music-player.playing .music-play-btn i { margin-left: 0; }

  /* Hiệu ứng sóng lan tỏa */
  .music-player.playing .music-play-btn::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid rgba(106, 17, 203, 0.8);
    animation: ripplePulse 1.5s ease-out infinite;
    pointer-events: none;
  }
  @keyframes ripplePulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* Visualizer */
  .visualizer {
    width: 140px;
    height: 34px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow: hidden;
    padding: 2px 0;
  }
  .visualizer span {
    flex: 1;
    height: 12%;
    background: linear-gradient(to top, #6a11cb, #2575fc, #00d4ff);
    border-radius: 2px;
    transition: height 0.4s ease;
    transform-origin: bottom;
  }
  .visualizer.playing span {
    animation: waveUpDown 0.7s ease-in-out infinite alternate;
  }
  @keyframes waveUpDown {
    from { height: 12%; }
    to   { height: 100%; }
  }

  /* Nút bật cảm biến (chỉ hiện trên iOS) */
  .gyro-btn {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(106, 17, 203, 0.6);
    z-index: 999;
    display: none;
    animation: pulseBtn 2s infinite;
  }
  .gyro-btn:active { transform: translateX(-50%) scale(0.95); }
  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 8px 25px rgba(106, 17, 203, 0.6); }
    50% { box-shadow: 0 8px 40px rgba(106, 17, 203, 0.9); }
  }

  /* Bong bóng nền */
  .bubbles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .bubbles span {
    position: absolute;
    bottom: -150px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Card chính */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 24px;
    padding: 40px 35px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1);
    transform-style: preserve-3d;
    transition: transform 0.3s ease-out, box-shadow 0.3s;
    will-change: transform;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Avatar */
  .avatar-container {
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #1877f2, #0a4fb3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(24, 119, 242, 0.4);
    animation: floatAvatar 3s ease-in-out infinite;
    position: relative;
    transform: translateZ(30px);
  }
  @keyframes floatAvatar {
    0%, 100% { transform: translateY(0) translateZ(30px); }
    50% { transform: translateY(-10px) translateZ(30px); }
  }
  .avatar-svg {
    width: 75px;
    height: 75px;
    fill: #ffffff;
    margin-top: 15px;
  }

  /* Tên */
  h1 {
    color: #fff;
    font-size: 1.8rem;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
    animation: textGlow 3s infinite alternate;
  }
  @keyframes textGlow {
    from { text-shadow: 0 0 5px rgba(255,255,255,0.2), 0 0 10px rgba(255,255,255,0.1); }
    to { text-shadow: 0 0 10px rgba(184,184,255,0.8), 0 0 20px rgba(184,184,255,0.4); }
  }

  .bio {
    color: #d1d1e0;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* Social buttons */
  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .social-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.4rem;
    text-decoration: none;
    position: relative;
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .social-btn:hover { transform: translateY(-12px) scale(1.2); }
  .social-btn::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
  }
  .social-btn:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .fb  { background: linear-gradient(135deg, #1877f2, #0a4fb3); }
  .tt  { background: linear-gradient(135deg, #25f4ee, #fe2c55); }
  .zl  { background: linear-gradient(135deg, #0068ff, #00a8ff); }
  .ig  { background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); }

  .fb:hover { box-shadow: 0 15px 35px rgba(24, 119, 242, 0.8); }
  .tt:hover { box-shadow: 0 15px 35px rgba(254, 44, 85, 0.8); }
  .zl:hover { box-shadow: 0 15px 35px rgba(0, 104, 255, 0.8); }
  .ig:hover { box-shadow: 0 15px 35px rgba(214, 41, 118, 0.8); }

  .fade-item {
    opacity: 0;
    animation: fadeUp 0.8s forwards;
  }
  .fade-item:nth-child(1) { animation-delay: 0.3s; }
  .fade-item:nth-child(2) { animation-delay: 0.5s; }
  .fade-item:nth-child(3) { animation-delay: 0.7s; }
  .fade-item:nth-child(4) { animation-delay: 0.9s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
    from { transform: translateY(20px); }
  }

  @media (max-width: 768px) {
    .music-player {
      top: 12px;
      right: 12px;
      padding: 6px 14px 6px 6px;
      gap: 8px;
    }
    .music-play-btn { width: 40px; height: 40px; font-size: 0.85rem; }
    .visualizer { width: 100px; height: 28px; }
    .play-hint { top: 70px; right: 12px; font-size: 0.78rem; padding: 8px 14px; }
  }

  @media (max-width: 480px) {
    .music-player {
      top: 10px;
      right: 10px;
      padding: 5px 12px 5px 5px;
      gap: 6px;
    }
    .music-play-btn { width: 36px; height: 36px; font-size: 0.75rem; }
    .visualizer { width: 70px; height: 24px; gap: 1.5px; }
    .play-hint { top: 60px; right: 10px; font-size: 0.72rem; padding: 7px 12px; }

    .card { padding: 30px 20px; }
    h1 { font-size: 1.5rem; }
    .social-btn { width: 50px; height: 50px; font-size: 1.2rem; }
    .avatar-container { width: 110px; height: 110px; }
    .avatar-svg { width: 60px; height: 60px; }
  }
</style>
</head>
<body>

<!-- IFRAME SOUNDCLOUD ẨN -->
<div class="sc-hidden">
  <iframe id="sc-widget"
    width="100%" height="200" scrolling="no" frameborder="no" allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fhaii-290775601%2Fkh-ng-bu-ng&color=%236a11cb&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
  </iframe>
</div>

<!-- Thông báo nhắc phát nhạc -->
<div class="play-hint" id="playHint">🔊 Chạm để phát nhạc</div>

<!-- MUSIC PLAYER -->
<div class="music-player" id="musicPlayer">
  <button class="music-play-btn" id="playBtn" aria-label="Play/Pause">
    <i class="fas fa-play" id="playIcon"></i>
  </button>
  <div class="visualizer" id="visualizer"></div>
</div>

<!-- Nút bật cảm biến cho iOS -->
<button class="gyro-btn" id="gyroBtn">📱 Bật hiệu ứng nghiêng</button>

<!-- Bong bóng nền -->
<div class="bubbles" id="bubbles"></div>

<div class="card" id="card">
  <div class="avatar-container fade-item">
    <svg class="avatar-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" />
      <path d="M12 14C7.58172 14 4 17.5817 4 22H20C20 17.5817 16.4183 14 12 14Z" />
    </svg>
  </div>

  <h1 class="fade-item">Đặng Đức Tuấn</h1>
  <p class="bio fade-item">Xin chào! ✨</p>

  <div class="socials fade-item">
    <a class="social-btn fb" data-tip="Facebook" href="https://www.facebook.com/anguctuan.101596/" target="_blank">
      <i class="fab fa-facebook-f"></i>
    </a>
    <a class="social-btn tt" data-tip="TikTok" href="https://www.tiktok.com/@d.ctun?_r=1&_t=ZS-99yOrqBveqe" target="_blank">
      <i class="fab fa-tiktok"></i>
    </a>
    <a class="social-btn zl" data-tip="Zalo" href="#" target="_blank">
      <i class="fas fa-comment-dots"></i>
    </a>
    <a class="social-btn ig" data-tip="Instagram" href="https://www.instagram.com/tundangduc/" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>
  </div>
</div>

<!-- Thư viện SoundCloud Widget API -->
<script src="https://w.soundcloud.com/player/api.js"></script>

<script>
  // ==========================================
  // 1. TẠO BONG BÓNG NỀN
  // ==========================================
  const container = document.getElementById('bubbles');
  for (let i = 0; i < 20; i++) {
    const b = document.createElement('span');
    const size = Math.random() * 60 + 20;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (Math.random() * 10 + 10) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(b);
  }

  // ==========================================
  // 2. TẠO THANH VISUALIZER
  // ==========================================
  const visualizer = document.getElementById('visualizer');
  const BAR_COUNT = 30;
  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('span');
    bar.style.animationDelay = (Math.random() * 0.6) + 's';
    bar.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
    visualizer.appendChild(bar);
  }

  // ==========================================
  // 3. PHÁT HIỆN THIẾT BỊ
  // ==========================================
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const isMobileUA = /iPhone|iPad|iPod|Android|Mobile|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);
  const isMobile = isTouchDevice && isMobileUA;

  // ==========================================
  // 4. HIỆU ỨNG 3D
  // ==========================================
  const card = document.getElementById('card');
  const gyroBtn = document.getElementById('gyroBtn');

  let gyroEnabled = false;
  let initialBeta = null;
  let initialGamma = null;
  let lastTouchTime = 0;

  function applyTilt(rotateX, rotateY) {
    card.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
  }
  function resetTilt() {
    card.style.transition = `transform 0.5s ease`;
    applyTilt(0, 0);
    setTimeout(() => card.style.transition = `transform 0.3s ease-out`, 500);
  }

  document.addEventListener('mousemove', (e) => {
    if (isMobile && gyroEnabled) return;
    const xAxis = (e.pageX - window.innerWidth / 2) / 25;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
    card.style.transition = `transform 0.1s ease-out`;
    applyTilt(yAxis, xAxis);
  });
  document.addEventListener('mouseleave', () => {
    if (isMobile && gyroEnabled) return;
    resetTilt();
  });

  document.addEventListener('touchstart', () => {
    lastTouchTime = Date.now();
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    lastTouchTime = Date.now();
    const touch = e.touches[0];
    const xAxis = (touch.pageX - window.innerWidth / 2) / 25;
    const yAxis = (window.innerHeight / 2 - touch.pageY) / 25;
    card.style.transition = `transform 0.1s ease-out`;
    applyTilt(yAxis, xAxis);
  }, { passive: true });
  document.addEventListener('touchend', resetTilt);
  document.addEventListener('touchcancel', resetTilt);

  function handleOrientation(e) {
    if (!gyroEnabled) return;
    if (Date.now() - lastTouchTime < 500) return;
    if (initialBeta === null) {
      initialBeta = e.beta;
      initialGamma = e.gamma;
      return;
    }
    let dB = Math.max(-25, Math.min(25, e.beta - initialBeta));
    let dG = Math.max(-25, Math.min(25, e.gamma - initialGamma));
    card.style.transition = `transform 0.15s ease-out`;
    applyTilt(dB * 0.8, dG * 0.8);
  }
  function startGyro() {
    gyroEnabled = true;
    initialBeta = null;
    initialGamma = null;
    window.addEventListener('deviceorientation', handleOrientation);
    gyroBtn.style.display = 'none';
  }
  if (isMobile && window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      gyroBtn.style.display = 'block';
      gyroBtn.addEventListener('click', async () => {
        try {
          const p = await DeviceOrientationEvent.requestPermission();
          if (p === 'granted') startGyro();
          else alert('Bạn cần cho phép truy cập cảm biến!');
        } catch (err) { console.error(err); }
      });
    } else {
      startGyro();
    }
  }

  // ==========================================
  // 5. SOUNDCLOUD PLAYER - PHIÊN BẢN NÂNG CẤP
  // ==========================================
  const iframe = document.getElementById('sc-widget');
  const widget = SC.Widget(iframe);
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const musicPlayer = document.getElementById('musicPlayer');
  const playHint = document.getElementById('playHint');

  let widgetReady = false;
  let isPlaying = false;      // Trạng thái thực tế (từ SoundCloud)
  let userWantsPlay = false;  // Ý định người dùng (để autoplay)

  // Hàm cập nhật UI nhanh (optimistic update)
  function setUIPlaying(playing) {
    if (playing) {
      playIcon.className = 'fas fa-pause';
      musicPlayer.classList.add('playing');
      visualizer.classList.add('playing');
      playHint.classList.remove('show');
    } else {
      playIcon.className = 'fas fa-play';
      musicPlayer.classList.remove('playing');
      visualizer.classList.remove('playing');
    }
  }

  // Khi SoundCloud sẵn sàng
  widget.bind(SC.Widget.Events.READY, () => {
    widgetReady = true;
    console.log('✅ SoundCloud ready');

    // LỚP 1: Thử autoplay ngay
    tryAutoPlay();
  });

  // Hàm thử phát nhạc
  function tryAutoPlay() {
    if (!widgetReady) return;
    userWantsPlay = true;

    // Cập nhật UI ngay lập tức
    setUIPlaying(true);

    // Gọi API phát nhạc
    widget.play();

    // Kiểm tra sau 800ms xem có phát được không
    setTimeout(() => {
      widget.isPaused((paused) => {
        if (paused) {
          // Autoplay bị chặn
          setUIPlaying(false);
          userWantsPlay = false;
          playHint.classList.add('show');
          console.log('⚠️ Autoplay bị chặn, chờ người dùng tương tác');
        } else {
          console.log('🎵 Đang phát nhạc');
        }
      });
    }, 800);
  }

  // LỚP 2: Phát ở lần tương tác đầu tiên
  function handleFirstInteraction(e) {
    // Bỏ qua nếu click vào nút play (để nút tự xử lý)
    if (e.target.closest('#playBtn')) return;
    // Bỏ qua nếu click vào link social
    if (e.target.closest('.social-btn')) return;
    // Bỏ qua nút gyro
    if (e.target.closest('#gyroBtn')) return;

    if (!userWantsPlay && widgetReady) {
      userWantsPlay = true;
      setUIPlaying(true);
      widget.play();
      removeFirstInteractionListeners();
    }
  }

  function removeFirstInteractionListeners() {
    document.removeEventListener('click', handleFirstInteraction);
    document.removeEventListener('touchstart', handleFirstInteraction);
  }

  // Đăng ký lắng nghe tương tác đầu tiên (chỉ khi autoplay thất bại)
  // Sẽ được kích hoạt sau khi thử autoplay
  setTimeout(() => {
    if (!userWantsPlay) {
      document.addEventListener('click', handleFirstInteraction);
      document.addEventListener('touchstart', handleFirstInteraction, { passive: true });
    }
  }, 1500);

  // ====== SỰ KIỆN TỪ SOUNDCLOUD ======
  widget.bind(SC.Widget.Events.PLAY, () => {
    isPlaying = true;
    userWantsPlay = true;
    setUIPlaying(true);
    removeFirstInteractionListeners();
  });

  widget.bind(SC.Widget.Events.PAUSE, () => {
    isPlaying = false;
    setUIPlaying(false);
  });

  widget.bind(SC.Widget.Events.FINISH, () => {
    isPlaying = false;
    userWantsPlay = false;
    setUIPlaying(false);
  });

  // ====== NÚT PLAY/PAUSE - NHANH VÀ NHẠY ======
  function handlePlayToggle(e) {
    e.preventDefault();
    e.stopPropagation();

    if (!widgetReady) {
      console.log('⏳ Đang tải SoundCloud, vui lòng đợi...');
      return;
    }

    // OPTIMISTIC UPDATE: Đổi icon NGAY LẬP TỨC
    const willPlay = !isPlaying;
    setUIPlaying(willPlay);

    // Gọi API SoundCloud
    if (willPlay) {
      userWantsPlay = true;
      widget.play();
    } else {
      userWantsPlay = false;
      widget.pause();
    }

    // Đồng bộ lại sau 600ms nếu cần (tránh lệch trạng thái)
    setTimeout(() => {
      widget.isPaused((paused) => {
        const actualPlaying = !paused;
        if (actualPlaying !== isPlaying) {
          setUIPlaying(actualPlaying);
        }
      });
    }, 600);
  }

  // Gắn nhiều loại sự kiện để bắt mọi trường hợp (chuột, cảm ứng, bút)
  playBtn.addEventListener('click', handlePlayToggle);
  playBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    handlePlayToggle(e);
  }, { passive: false });
</script>
</body>
</html>

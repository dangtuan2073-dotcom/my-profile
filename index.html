<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giới Thiệu Bản Thân</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #6a11cb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow: hidden;
    padding: 20px;
  }

  @keyframes gradientBG {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Bong bóng nền */
  .bubbles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    z-index: 0;
  }
  .bubbles span {
    position: absolute;
    bottom: -150px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Card chính */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 24px;
    padding: 40px 35px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff00cc, #3333ff, #00ffcc, #ff00cc);
    animation: spin 4s linear infinite;
    z-index: -1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #1a1a2e;
    display: block;
    transition: transform 0.4s;
  }
  .avatar:hover { transform: scale(1.05); }

  /* Tên */
  h1 {
    color: #fff;
    font-size: 1.8rem;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .job {
    color: #b8b8ff;
    font-size: 0.95rem;
    margin-bottom: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .bio {
    color: #d1d1e0;
    font-size: 0.9rem;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* Nút social */
  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .social-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.4rem;
    text-decoration: none;
    position: relative;
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .social-btn:hover {
    transform: translateY(-8px) scale(1.15);
  }
  .social-btn::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
  }
  .social-btn:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .fb  { background: linear-gradient(135deg, #1877f2, #0a4fb3); }
  .tt  { background: linear-gradient(135deg, #25f4ee, #fe2c55); }
  .zl  { background: linear-gradient(135deg, #0068ff, #00a8ff); }
  .ig  { background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); }

  .fb:hover { box-shadow: 0 12px 30px rgba(24, 119, 242, 0.7); }
  .tt:hover { box-shadow: 0 12px 30px rgba(254, 44, 85, 0.7); }
  .zl:hover { box-shadow: 0 12px 30px rgba(0, 104, 255, 0.7); }
  .ig:hover { box-shadow: 0 12px 30px rgba(214, 41, 118, 0.7); }

  /* Hiệu ứng fade-in tuần tự */
  .fade-item {
    opacity: 0;
    animation: fadeUp 0.8s forwards;
  }
  .fade-item:nth-child(1) { animation-delay: 0.3s; }
  .fade-item:nth-child(2) { animation-delay: 0.5s; }
  .fade-item:nth-child(3) { animation-delay: 0.7s; }
  .fade-item:nth-child(4) { animation-delay: 0.9s; }
  .fade-item:nth-child(5) { animation-delay: 1.1s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
    from { transform: translateY(20px); }
  }

  @media (max-width: 480px) {
    .card { padding: 30px 20px; }
    h1 { font-size: 1.5rem; }
    .social-btn { width: 50px; height: 50px; font-size: 1.2rem; }
  }
</style>
</head>
<body>

<!-- Bong bóng nền -->
<div class="bubbles" id="bubbles"></div>

<div class="card">
  <div class="avatar-wrap fade-item">
    <!-- Thay URL ảnh của bạn vào đây -->
    <img class="avatar" src="https://i.pravatar.cc/300?img=12" alt="Avatar">
  </div>

  <h1 class="fade-item">Đặng Đức Tuấn</h1>
  <p class="job fade-item"> </p>
  <p class="bio fade-item">
    Xin chào! ✨
  </p>

  <div class="socials fade-item">
    <!-- THAY LINK CỦA BẠN VÀO href -->
    <a class="social-btn fb" data-tip="Facebook" href="https://www.facebook.com/anguctuan.101596/">
      <i class="fab fa-facebook-f"></i>
    </a>
    <a class="social-btn tt" data-tip="TikTok" href="https://www.tiktok.com/@d.ctun?_r=1&_t=ZS-99yOrqBveqe">
      <i class="fab fa-tiktok"></i>
    </a>
    <a class="social-btn zl" data-tip="Zalo" href="https://zalo.me/0123456789" target="_blank">
      <i class="fas fa-comment-dots"></i>
    </a>
    <a class="social-btn ig" data-tip="Instagram" href="https://www.instagram.com/tundangduc/">
      <i class="fab fa-instagram"></i>
    </a>
  </div>
</div>

<script>
  // Tạo bong bóng nền
  const container = document.getElementById('bubbles');
  for (let i = 0; i < 20; i++) {
    const b = document.createElement('span');
    const size = Math.random() * 60 + 20;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (Math.random() * 10 + 10) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(b);
  }
</script>
</body>
</html>
